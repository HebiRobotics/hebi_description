# R-Series 6-DoF Arm
version: 1.0
families: ["Compass"]
names: ["J1_base", "J2_shoulder", "J3_elbow", "J4_wrist1", "J5_wrist2", "J6_wrist3"]
hrdf: "hrdf/A-2240-06.hrdf"

gains:
  default: "gains/A-2240-06.xml"

user_data:
  # IK Seed positions for inverse kinematics
  ik_seed_pos: [0.0, 1.2, 1.8, 0.6, 1.5708, 0.0]

  # Home Position
  home_position: [0.0, 1.2, 1.8, 0.6, 1.5708, 0.0]

plugins:
  - type: GravityCompensationEffort
    name: gravComp
    enabled: true
    ramp_time: 5

  - type: DynamicsCompensationEffort
    name: dynamicsComp
    enabled: true
    ramp_time: 5

  # Kits with a gas spring need to add a shoulder compensation torque.
  # It should be around -7 Nm for most kits, but it may need to be tuned
  # for your specific setup.
  - name: 'gasSpringCompensation'
    type: EffortOffset
    enabled: true
    ramp_time: 5
    offset: [0, -7, 0, 0, 0, 0]
